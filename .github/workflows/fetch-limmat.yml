name: Fetch Limmat Temperature

on:
  workflow_dispatch:      # getriggert via cron-job.org (GitHub-Scheduler ist unzuverlässig für inaktive Repos)

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch and upload to OneDrive
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
        run: |
          python3 - << 'EOF'
          import requests, json, os
          import xml.etree.ElementTree as ET
          from datetime import datetime

          xml_url = "https://www.stadt-zuerich.ch/stzh/bathdatadownload"
          relevante_poiids = ["flb6939", "flb8803"]

          response = requests.get(xml_url)
          response.raise_for_status()
          root = ET.fromstring(response.content)
          ergebnisse = []

          for bad in root.findall(".//bath"):
              poiid = bad.findtext("poiid", "").strip()
              if poiid in relevante_poiids:
                  name = bad.findtext("title", "").strip()
                  temperature = bad.findtext("temperatureWater", "").strip()
                  timestamp = bad.findtext("dateModified", "").strip()
                  ergebnisse.append({
                      "name": name,
                      "temperature": f"{temperature} °C" if temperature else "n/a",
                      "timestamp": timestamp
                  })

          output = json.dumps({
              "abgerufen_am": datetime.now().isoformat(),
              "daten": ergebnisse
          }, ensure_ascii=False, indent=2)

          print("✅ Temperaturdaten abgerufen.")

          token_response = requests.post(
              f"https://login.microsoftonline.com/{os.environ['AZURE_TENANT_ID']}/oauth2/v2.0/token",
              data={
                  "grant_type": "refresh_token",
                  "client_id": os.environ["AZURE_CLIENT_ID"],
                  "refresh_token": os.environ["AZURE_REFRESH_TOKEN"],
                  "scope": "https://graph.microsoft.com/Files.ReadWrite offline_access",
              },
          )
          token_response.raise_for_status()
          tok = token_response.json()
          access_token = tok["access_token"]

          # Azure rotiert den Refresh Token bei jedem Refresh. Den neuen für den
          # nächsten Lauf rausschreiben — der nachgelagerte Step persistiert ihn
          # ins GitHub Secret. Ohne das altert das statische Secret und failt
          # irgendwann mit HTTP 400 (invalid_grant).
          new_refresh_token = tok.get("refresh_token")
          if new_refresh_token:
              with open("new_refresh_token.txt", "w") as f:
                  f.write(new_refresh_token)
              print("ℹ️  Neuer Refresh Token erhalten (wird zurückgeschrieben).")

          upload_response = requests.put(
              f"https://graph.microsoft.com/v1.0/me/drive/root:/Coding/limmat_temp.json:/content",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": "application/json",
              },
              data=output.encode("utf-8"),
          )
          upload_response.raise_for_status()
          print("✅ OneDrive-Upload erfolgreich.")
          EOF

      - name: Persist rotated refresh token
        # always(): Azure hat den alten Token beim Refresh bereits konsumiert/rotiert.
        # Der neue muss auch dann zurückgeschrieben werden, wenn der Upload-Step
        # oben fehlschlägt — sonst nutzt der nächste Lauf einen ungültigen Token.
        if: always()
        continue-on-error: true   # Token-Rückschreiben darf den Fetch-Job nie failen lassen
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ℹ️  GH_SECRETS_PAT nicht gesetzt – Token-Rückschreiben übersprungen."
            echo "    (Workflow funktioniert weiter, aber das Refresh-Token-Secret altert manuell.)"
            exit 0
          fi
          if [ ! -s new_refresh_token.txt ]; then
            echo "ℹ️  Kein neuer Refresh Token vorhanden – nichts zurückzuschreiben."
            exit 0
          fi
          gh secret set AZURE_REFRESH_TOKEN --repo "${{ github.repository }}" < new_refresh_token.txt
          echo "✅ Rotierter Refresh Token ins Secret zurückgeschrieben."
          shred -u new_refresh_token.txt 2>/dev/null || rm -f new_refresh_token.txt
